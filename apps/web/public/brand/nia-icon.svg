<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Nia" class="nia-mascot" data-state="idle">
  <title>Nia</title>
  <defs>
    <linearGradient id="fav-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EEF3F5"/><stop offset="1" stop-color="#D3DEE3"/>
    </linearGradient>
    <linearGradient id="fav-flipper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EEF1"/><stop offset="1" stop-color="#C5D3D9"/>
    </linearGradient>
    <linearGradient id="fav-visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B38"/><stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="fav-muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/>
    </linearGradient>
    <linearGradient id="fav-tusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1EBDA"/>
    </linearGradient>
    <radialGradient id="fav-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6FE3EE" stop-opacity=".55"/><stop offset=".6" stop-color="#6FE3EE" stop-opacity=".12"/><stop offset="1" stop-color="#6FE3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fav-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BE8F2" stop-opacity="0"/><stop offset=".5" stop-color="#7BE8F2" stop-opacity=".55"/><stop offset="1" stop-color="#7BE8F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F8FA"/><stop offset="1" stop-color="#CDEFF3"/>
    </linearGradient>
    <filter id="fav-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fav-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="fav-visor-clip"><rect x="60" y="62" width="120" height="62" rx="31"/></clipPath>
  </defs>
  <rect width="240" height="240" fill="url(#fav-bg)"/>
  <circle class="nia-halo" cx="120" cy="120" r="104" fill="url(#fav-halo)"/>
  
  <ellipse cx="120" cy="214" rx="58" ry="8" fill="#0B0E13" opacity=".16" filter="url(#fav-soft)"/>
  <g class="nia-body-group">
    <g class="nia-flipper nia-flipper-left"><path d="M52 150 C34 158 26 178 32 192 C44 196 58 186 64 170 Z" fill="url(#fav-flipper)"/></g>
    <g class="nia-flipper nia-flipper-right"><path d="M188 150 C206 158 214 178 208 192 C196 196 182 186 176 170 Z" fill="url(#fav-flipper)"/></g>
    <path class="nia-body" d="M120 30 C177 30 204 76 204 128 C204 180 170 208 120 208 C70 208 36 180 36 128 C36 76 63 30 120 30 Z" fill="url(#fav-body)" stroke="#C3D1D7" stroke-width="1.5"/>
    <ellipse cx="90" cy="58" rx="30" ry="12" fill="#FFFFFF" opacity=".85" transform="rotate(-22 90 58)"/>
    <circle class="nia-led" cx="120" cy="44" r="4.5" fill="#2EC4D6" filter="url(#fav-glow)"/>
    <rect x="60" y="62" width="120" height="62" rx="31" fill="url(#fav-visor)"/>
    <rect x="61" y="63" width="118" height="60" rx="30" fill="none" stroke="#6FE3EE" stroke-opacity=".28" stroke-width="1.5"/>
    <path d="M76 76 Q92 67 116 67" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="5" stroke-linecap="round"/>
    <g class="nia-eyes" filter="url(#fav-glow)" fill="#7BE8F2">
        <rect x="90" y="83" width="14" height="22" rx="7"/><rect x="136" y="83" width="14" height="22" rx="7"/></g>
    
    <path d="M110 156 C109 170 106 181 101 190 C107 189 113 178 116 158 Z" fill="url(#fav-tusk)" stroke="#DCD3BC" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M130 156 C131 170 134 181 139 190 C133 189 127 178 124 158 Z" fill="url(#fav-tusk)" stroke="#DCD3BC" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="106" cy="145" r="17" fill="url(#fav-muzzle)" stroke="#D5DEE2" stroke-width="1.2"/>
    <circle cx="134" cy="145" r="17" fill="url(#fav-muzzle)" stroke="#D5DEE2" stroke-width="1.2"/>
    <ellipse cx="120" cy="133" rx="8" ry="5" fill="#2A3342"/>
    <g fill="#9AA8B1"><circle cx="98" cy="142" r="1.7"/><circle cx="104" cy="149" r="1.7"/><circle cx="96" cy="152" r="1.7"/><circle cx="142" cy="142" r="1.7"/><circle cx="136" cy="149" r="1.7"/><circle cx="144" cy="152" r="1.7"/></g>
  </g>
  
  
</svg>